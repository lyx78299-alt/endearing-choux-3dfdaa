<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>热门 Benchmark 跟踪 · 历史报告</title>
<style>
:root{
  --bg:#f4f6fa;
  --panel:#ffffff;
  --ink:#172033;
  --muted:#667085;
  --line:#e5e9f2;
  --blue:#2459d3;
  --navy:#0f172a;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
}
a{text-decoration:none;color:var(--blue)}
.top{
  background:var(--navy);
  color:#fff;
  padding:12px 22px;
}
.wrap{
  max-width:1050px;
  margin:auto;
}
.top-inner{
  display:flex;
  align-items:center;
  gap:18px;
}
.top strong{margin-right:auto}
.top a{color:#dbe5ff}
.hero{
  background:linear-gradient(120deg,#17284f,#274684 62%,#315bd5);
  color:#fff;
  padding:38px 22px;
}
.hero h1{
  margin:0 0 8px;
  font-size:31px;
}
.hero p{
  margin:0;
  color:#d8e2ff;
  font-size:13px;
}
main{padding:22px}
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
}
.report{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:15px 4px;
  border-bottom:1px solid var(--line);
  transition:background .18s ease,transform .18s ease;
}
.report:last-child{border-bottom:0}
.report-title{
  font-weight:800;
  font-size:15px;
}
.meta{
  margin-top:4px;
  font-size:12px;
  color:var(--muted);
}
.open{
  border:1px solid #d7e3ff;
  background:#edf3ff;
  color:#2459d3;
  padding:7px 11px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.empty{
  padding:28px;
  color:var(--muted);
  text-align:center;
}
@media(hover:hover) and (pointer:fine){
  .report:hover{
    background:#f8faff;
    transform:translateX(2px);
  }
  .open:hover{
    background:#e3ecff;
  }
}
@media(max-width:640px){
  .report{
    align-items:flex-start;
    flex-direction:column;
  }
}
</style>
</head>
<body>

<div class="top">
  <div class="wrap top-inner">
    <strong>热门 Benchmark 跟踪</strong>
    <a href="/">最新报告</a>
    <a href="/archive/">历史报告</a>
  </div>
</div>

<header class="hero">
  <div class="wrap">
    <h1>历史报告</h1>
    <p>查看每次 Benchmark 定时更新保留的历史快照。</p>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="panel">
      <div id="list" class="empty">正在加载历史报告…</div>
    </section>
  </div>
</main>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[m]));

fetch("/data/history.json", {cache:"no-store"})
  .then(r => {
    if (!r.ok) throw new Error("history.json 加载失败");
    return r.json();
  })
  .then(items => {
    const el = document.getElementById("list");

    if (!Array.isArray(items) || items.length === 0) {
      el.className = "empty";
      el.textContent = "暂无历史报告";
      return;
    }

    const rows = items
      .slice()
      .sort((a,b) => String(b.date).localeCompare(String(a.date)))
      .map(x => {
        const type = x.format === "legacy-html" ? "旧版 HTML 快照" : "JSON 历史快照";
        const href = x.href || (x.date ? `/?date=${encodeURIComponent(x.date)}` : "#");
        const label = x.label || x.date || "未命名报告";

        return `
          <div class="report">
            <div>
              <div class="report-title">${esc(label)}</div>
              <div class="meta">${esc(type)} · ${esc(x.date || "")}</div>
            </div>
            <a class="open" href="${esc(href)}">打开报告</a>
          </div>
        `;
      }).join("");

    el.className = "";
    el.innerHTML = rows;
  })
  .catch(err => {
    const el = document.getElementById("list");
    el.className = "empty";
    el.innerHTML = "历史报告加载失败，请检查 <b>data/history.json</b> 是否存在。";
  });
</script>

</body>
</html>
