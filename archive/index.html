<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>热门 Benchmark 跟踪 · 历史归档</title><style>body{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#17233f;color:#fff;padding:28px 22px}.wrap{max-width:1000px;margin:auto}main{padding:22px}.panel{background:white;border:1px solid #e5e9f2;border-radius:16px;padding:18px}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #e5e9f2}a{color:#3157d5;text-decoration:none}.back{color:#c7d2fe}.muted{color:#667085;font-size:12px}</style></head><body><header><div class="wrap"><a class="back" href="/">← 返回最新报告</a><h1>热门 Benchmark 跟踪 · 历史归档</h1></div></header><main><div class="wrap"><div class="panel" id="list">加载中…</div></div></main><script>fetch('/data/history.json',{cache:'no-store'}).then(r=>r.json()).then(xs=>{document.getElementById('list').innerHTML=xs.slice().reverse().map(x=>`<div class="row"><a href="${x.href}"><b>${x.label||x.date}</b></a><span class="muted">${x.format||''}</span></div>`).join('')}).catch(e=>document.getElementById('list').textContent='加载失败：'+e.message)</script></body></html>
