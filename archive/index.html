<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>热门 Benchmark 跟踪 · 历史报告</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#172033;--muted:#667085;--line:#e5e9f2;--blue:#2459d3;--navy:#0f172a}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{text-decoration:none;color:var(--blue)}
.top{background:var(--navy);color:#fff;padding:12px 22px}
.wrap{max-width:1050px;margin:auto}
.top-inner{display:flex;align-items:center;gap:18px} .top strong{margin-right:auto} .top a{color:#dbe5ff}
.hero{background:linear-gradient(120deg,#17284f,#274684 62%,#315bd5);color:#fff;padding:38px 22px}
.hero h1{margin:0 0 8px;font-size:31px} .hero p{margin:0;color:#d8e2ff;font-size:13px}
main{padding:22px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.report{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 4px;border-bottom:1px solid var(--line)}
.report:last-child{border-bottom:0}
.report-title{font-weight:800;font-size:15px}
.meta{margin-top:4px;font-size:12px;color:var(--muted)}
.open{border:1px solid #d7e3ff;background:#edf3ff;color:#2459d3;padding:7px 11px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap}
.notice{font-size:12px;color:#9a6700;background:#fff8db;border:1px solid #f5d97a;border-radius:9px;padding:10px 12px;margin-bottom:12px;display:none}
@media(hover:hover) and (pointer:fine){
 .report:hover{background:#f8faff}
 .open:hover{background:#e3ecff}
}
</style>
</head>
<body>
<div class="top"><div class="wrap top-inner">
<strong>热门 Benchmark 跟踪</strong>
<a href="/">最新报告</a>
<a href="/archive/">历史报告</a>
</div></div>

<header class="hero"><div class="wrap">
<h1>历史报告</h1>
<p>查看每次 Benchmark 更新保留的历史快照。</p>
</div></header>

<main><div class="wrap">
<div id="notice" class="notice"></div>
<section class="panel"><div id="list"></div></section>
</div></main>

<script>
const FALLBACK = [{"date": "2026-08-27", "label": "2026-08-27（旧版存档）", "href": "/archive/2026-08-27.html", "format": "legacy-html"}, {"date": "2026-08-28", "label": "2026-08-28", "href": "/?date=2026-08-28", "data": "/data/archive/2026-08-28.json", "format": "json"}];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function render(items){
 const el=document.getElementById("list");
 el.innerHTML=items.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(x=>{
   const type=x.format==="legacy-html"?"旧版 HTML 快照":"JSON 历史快照";
   const href=x.href || (x.date?`/?date=${encodeURIComponent(x.date)}`:"#");
   return `<div class="report">
     <div>
       <div class="report-title">${esc(x.label||x.date)}</div>
       <div class="meta">${esc(type)} · ${esc(x.date||"")}</div>
     </div>
     <a class="open" href="${esc(href)}">打开报告</a>
   </div>`;
 }).join("");
}

render(FALLBACK);

fetch("/data/history.json?ts="+Date.now(), {cache:"no-store"})
 .then(r=>{if(!r.ok) throw new Error("HTTP "+r.status); return r.json();})
 .then(items=>{if(Array.isArray(items)&&items.length) render(items);})
 .catch(err=>{
   const n=document.getElementById("notice");
   n.style.display="block";
   n.textContent="当前使用页面内置历史记录；data/history.json 暂未加载成功。";
 });
</script>
</body>
</html>
