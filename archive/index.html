<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Benchmark Tracker · 历史归档</title>
<style>
body{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}
header{background:#17233f;color:#fff;padding:28px 22px} .wrap{max-width:1100px;margin:auto}
main{padding:22px}.panel{background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:18px}
a{color:#3157d5;text-decoration:none}.row{padding:14px 0;border-bottom:1px solid #e5e9f2;display:flex;justify-content:space-between;gap:14px}
small{color:#667085}.back{color:#c7d2fe}
</style></head>
<body>
<header><div class="wrap"><a class="back" href="/">← 返回最新报告</a><h1>历史归档</h1><p>每日 10:00 更新后保留当日快照。</p></div></header>
<main><div class="wrap"><div class="panel" id="list">加载中…</div></div></main>
<script>
fetch('/data/history.json',{cache:'no-store'}).then(r=>r.json()).then(items=>{
 const el=document.getElementById('list');
 el.innerHTML=items.slice().reverse().map(x=>`<div class="row"><div><a href="${x.href}"><strong>${x.date}</strong></a><br><small>Benchmark ${x.benchmarks} 个 · 来源 ${x.watch_sources} 个</small></div><small>${x.updated_at}</small></div>`).join('');
}).catch(()=>document.getElementById('list').textContent='历史数据暂不可用');
</script></body></html>
