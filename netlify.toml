[build]
  publish = "."

# 所有旧“历史报告”地址强制跳回首页
[[redirects]]
  from = "/archive"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/archive/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/history.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/data/latest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
