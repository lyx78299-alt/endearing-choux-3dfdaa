<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>热门 Benchmark 跟踪</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#667085;--line:#e5e9f2;--blue:#3157d5}*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}a{color:var(--blue);text-decoration:none}.top{background:#0f172a;color:#fff;padding:10px 22px}.wrap{max-width:1440px;margin:auto}.nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.nav strong{margin-right:auto}.nav a{color:#c7d2fe}.hero{background:linear-gradient(120deg,#14213e,#263d76 60%,#3157d5);color:#fff;padding:38px 22px}.hero h1{font-size:34px;margin:0 0 8px}.hero p{margin:0;color:#dce5ff}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.meta span{border:1px solid #ffffff2e;background:#ffffff12;border-radius:999px;padding:5px 9px;font-size:12px}main{padding:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 8px 28px rgba(23,32,51,.05)}h2{font-size:20px;margin:0 0 14px}.stats{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:10px}.stat{border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{font-size:22px;display:block}.featured-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.featured{border:1px solid var(--line);border-radius:14px;padding:14px}.rank{font-size:25px;color:#98a2b3;font-weight:800}.featured h3{margin:4px 0}.small{font-size:12px;color:var(--muted)}.change{padding:10px 12px;border-left:3px solid var(--blue);background:#f7f9ff;border-radius:8px;margin:7px 0}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select{border:1px solid #d0d5dd;border-radius:9px;padding:9px 10px;background:white}input{min-width:280px;flex:1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1350px;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eaecf0;vertical-align:top;text-align:left}th{background:#f9fafb}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;background:#f2f4f7}.S{background:#fee4e2;color:#b42318}.A{background:#fff2d8;color:#b54708}.B{background:#eaf2ff;color:#175cd3}details{background:#fff;border:1px solid var(--line);border-radius:12px;margin:9px 0}summary{cursor:pointer;padding:14px;font-weight:700}.details{padding:0 14px 14px}.details-grid{display:grid;grid-template-columns:190px 1fr;gap:8px 14px;font-size:13px}.key{font-weight:600;color:#475467}.loading{padding:30px;text-align:center;color:var(--muted)}.error{color:#b42318;background:#fff0ee;padding:14px;border-radius:10px}@media(max-width:1000px){.featured-grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.featured-grid,.stats{grid-template-columns:1fr}.details-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div class="wrap nav"><strong>热门 Benchmark 跟踪</strong><a href="/">最新报告</a><a href="/archive/">历史归档</a><a href="/data/latest.json" target="_blank">Latest JSON</a></div></div>
<header class="hero"><div class="wrap"><h1>热门 Benchmark 跟踪</h1><p>每日动态跟踪 Benchmark 热度、数据生产机会、License 风险和 BD 优先级。</p><div class="meta" id="meta"></div></div></header>
<main class="wrap">
<div id="loading" class="panel loading">正在加载最新 Benchmark 数据…</div>
<div id="app" hidden>
<section class="panel"><h2>今日概览</h2><div class="stats" id="stats"></div></section>
<section class="panel"><h2>今日重点推荐</h2><div class="featured-grid" id="featured"></div></section>
<section class="panel"><h2>今日变化摘要</h2><div id="changes"></div></section>
<section class="panel"><h2>Benchmark 总览表</h2><div class="controls"><input id="q" placeholder="搜索 Benchmark / 团队 / 联系方式…"><select id="dir"><option value="">全部方向</option></select><select id="bp"><option value="">全部商机</option><option>S</option><option>A</option><option>B</option><option>C</option></select><select id="pp"><option value="">全部产品化</option><option>S</option><option>A</option><option>B</option><option>C</option></select><select id="trend"><option value="">全部热度</option><option>上升</option><option>持平</option><option>下降</option><option>新增</option></select></div><div class="tablewrap"><table><thead><tr><th>名称</th><th>方向</th><th>当前热度</th><th>较昨日</th><th>商机</th><th>商机变化</th><th>产品化</th><th>产品化变化</th><th>联系方式</th><th>链接</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
<section class="panel"><h2>稳定更新 Benchmark 来源网站</h2><div class="tablewrap"><table><thead><tr><th>优先级</th><th>平台</th><th>类型</th><th>团队</th><th>最近状态</th><th>今日变化</th><th>为什么值得跟</th><th>每日监控点</th><th>联系方式</th><th>入口</th></tr></thead><tbody id="sources"></tbody></table></div></section>
<section><h2>详细项目卡</h2><div id="details"></div></section>
<section class="panel"><h2>新增 / 移出监控</h2><div id="watchChanges"></div></section>
</div>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const A=(u,t='访问 ↗')=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`:'—';
let R=null;
async function load(){try{const p=new URLSearchParams(location.search),date=p.get('date'),url=date?`/data/archive/${encodeURIComponent(date)}.json`:'/data/latest.json';const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error(`${res.status} ${res.statusText}`);R=await res.json();renderAll();document.getElementById('loading').hidden=true;document.getElementById('app').hidden=false}catch(err){document.getElementById('loading').innerHTML=`<div class="error">加载失败：${esc(err.message)}。请检查 data/latest.json。</div>`}}
function renderAll(){document.title=`热门 Benchmark 跟踪 · ${R.report_date}`;document.getElementById('meta').innerHTML=[`报告日期：${R.report_date}`,`更新时间：${R.updated_at}`,`时区：${R.timezone}`].map(x=>`<span>${esc(x)}</span>`).join('');const s=R.summary||{},ss=[['Benchmark',s.benchmark_count],['新增',s.new_benchmarks],['热度上升',s.heat_up],['商机 S',s.business_s],['产品 S',s.product_s],['来源站',s.watch_source_count]];document.getElementById('stats').innerHTML=ss.map(x=>`<div class="stat"><b>${esc(x[1]??0)}</b><span class="small">${esc(x[0])}</span></div>`).join('');document.getElementById('featured').innerHTML=(R.featured||[]).map(x=>`<article class="featured"><div class="rank">#${esc(x.rank)}</div><h3>${esc(x.name)}</h3><span class="badge">${esc(x.change_vs_yesterday)}</span><p>${esc(x.reason)}</p><p class="small"><b>联系：</b>${esc(x.contact)}</p><p class="small"><b>下一步：</b>${esc(x.next_bd_action)}</p></article>`).join('');document.getElementById('changes').innerHTML=(R.changes||[]).map(x=>`<div class="change">${esc(x)}</div>`).join('');document.getElementById('dir').innerHTML='<option value="">全部方向</option>'+[...new Set((R.benchmarks||[]).map(x=>x.direction))].sort().map(x=>`<option>${esc(x)}</option>`).join('');renderRows();document.getElementById('sources').innerHTML=(R.watch_sources||[]).map(x=>`<tr><td><span class="badge ${esc(x.priority)}">${esc(x.priority)}</span></td><td><b>${esc(x.name)}</b></td><td>${esc(x.type)}</td><td>${esc(x.team)}</td><td>${esc(x.recent_status)}</td><td>${esc(x.today_change)}</td><td>${esc(x.why)}</td><td>${esc(x.daily_monitor)}</td><td>${esc(x.contact)}</td><td>${A(x.url)}</td></tr>`).join('');const fs=[['description','简介'],['team','团队 / 机构'],['direction','研究方向'],['release_or_update','发布时间 / 最近更新时间'],['heat_signal','当前热度'],['heat_delta','较昨日热度变化'],['contact','团队联系方式'],['data_scale_structure','数据规模与结构'],['production_method','数据生产方式'],['dependencies','人工 / 专家 / 环境依赖'],['outsourcing','可外包的数据生产或质检环节'],['license_risk','License 与商业风险'],['service_opportunity','数据处理服务商机'],['productization','数据产品化判断'],['poc','POC 建议'],['business_priority','商机优先级'],['business_priority_delta','商机变化'],['product_priority','产品化优先级'],['product_priority_delta','产品化变化']];document.getElementById('details').innerHTML=(R.benchmarks||[]).map(x=>`<details><summary>${esc(x.name)} · 商机 ${esc(x.business_priority)} / 产品 ${esc(x.product_priority)}</summary><div class="details"><div class="details-grid">${fs.map(([k,n])=>`<div class="key">${esc(n)}</div><div>${esc(x[k])}</div>`).join('')}<div class="key">论文 / 官网 / GitHub / 数据集 / Leaderboard</div><div>${A(x.paper,'论文')} · ${A(x.website,'官网')} · ${A(x.github,'GitHub')} · ${A(x.dataset,'数据集')} · ${A(x.leaderboard,'Leaderboard')}</div></div></div></details>`).join('');document.getElementById('watchChanges').innerHTML=`<p><b>新增进入主项目库：</b>${(R.added_to_watch||[]).length?R.added_to_watch.map(esc).join('、'):'无'}</p><p><b>移至观察区：</b>${(R.moved_to_observation||[]).length?R.moved_to_observation.map(esc).join('、'):'无'}</p>`}
function renderRows(){const qv=document.getElementById('q').value.toLowerCase(),dv=document.getElementById('dir').value,bv=document.getElementById('bp').value,pv=document.getElementById('pp').value,tv=document.getElementById('trend').value,xs=(R.benchmarks||[]).filter(x=>(!qv||JSON.stringify(x).toLowerCase().includes(qv))&&(!dv||x.direction===dv)&&(!bv||x.business_priority===bv)&&(!pv||x.product_priority===pv)&&(!tv||x.trend===tv));document.getElementById('tbody').innerHTML=xs.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.direction)}</td><td>${esc(x.heat_signal)}</td><td><span class="badge">${esc(x.trend)}</span> ${esc(x.heat_delta)}</td><td><span class="badge ${esc(x.business_priority)}">${esc(x.business_priority)}</span></td><td>${esc(x.business_priority_delta)}</td><td><span class="badge ${esc(x.product_priority)}">${esc(x.product_priority)}</span></td><td>${esc(x.product_priority_delta)}</td><td>${esc(x.contact)}</td><td>${A(x.website)} · ${A(x.github,'GitHub ↗')}</td></tr>`).join('')}
['q','dir','bp','pp','trend'].forEach(id=>document.getElementById(id).addEventListener('input',()=>R&&renderRows()));load();
</script>
</body></html>
